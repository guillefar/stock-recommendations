name: Tests

# push is main-only so PR branches don't run the suite twice
# (once for push, once for pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Pure-logic unit tests (no DB / no API). See tests/.
      - name: Run pytest
        run: python -m pytest tests/ -q
