name: Stock Recommendations

on:
  schedule:
    # Mon/Wed/Fri at 12:00 CEST (UTC+2 summer time → 10:00 UTC).
    # GitHub cron is always UTC and does not observe DST, so during CET
    # (winter, UTC+1) this fires at 11:00 local. Cadence lowered from daily
    # to 3×/week by user decision (session 21): the investor horizon is
    # months/years, daily runs mostly re-stated the same theses, and this
    # cuts the API bill ~40%. Friday MUST stay in the schedule — it triggers
    # the weekly retrospective (src/main.py runs it on Fridays only).
    - cron: '0 10 * * 1,3,5'   # 12:00 CEST (Madrid/Berlin), lun/mié/vie
  workflow_dispatch:          # permite ejecución manual

# One run at a time; a queued run waits instead of overlapping (the 4h dedup
# protects recommendations but not the daily-summary upsert).
concurrency:
  group: stock-recs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Must stay above src.main's batch budget: BATCH_DEADLINE_SECONDS (90 min)
    # plus BATCH_CANCEL_GRACE_SECONDS (5 min) plus ~10 min of collection,
    # summary, weekly steps and setup. The old 60 min ceiling was already
    # tighter than the batch tail (07-17 and 07-27 both burned 48 min).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock recommendations
        run: python -m src.main
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # Grades matured recommendations against realized prices. Independent of
      # today's run, so it executes even if the step above failed.
      - name: Evaluate recommendation outcomes
        if: ${{ !cancelled() }}
        run: python -m src.evaluate_outcomes
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
