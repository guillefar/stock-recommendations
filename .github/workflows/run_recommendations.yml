name: Stock Recommendations

on:
  schedule:
    # Mon/Wed/Fri at 12:00 CEST (UTC+2 summer time → 10:00 UTC).
    # GitHub cron is always UTC and does not observe DST, so during CET
    # (winter, UTC+1) this fires at 11:00 local. Cadence lowered from daily
    # to 3×/week by user decision (session 21): the investor horizon is
    # months/years, daily runs mostly re-stated the same theses, and this
    # cuts the API bill ~40%. Friday MUST stay in the schedule — it triggers
    # the weekly retrospective (src/main.py runs it on Fridays only).
    - cron: '0 10 * * 1,3,5'   # 12:00 CEST (Madrid/Berlin), lun/mié/vie
  workflow_dispatch:          # permite ejecución manual

# One run at a time; a queued run waits instead of overlapping (the 4h dedup
# protects recommendations but not the daily-summary upsert).
concurrency:
  group: stock-recs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Must stay above src.main's batch budget: BATCH_DEADLINE_SECONDS (90 min)
    # plus BATCH_CANCEL_GRACE_SECONDS (5 min) plus ~10 min of collection,
    # summary, weekly steps and setup. The old 60 min ceiling was already
    # tighter than the batch tail (07-17 and 07-27 both burned 48 min).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock recommendations
        run: python -m src.main
        env:
          # Patterns→prompt feedback loop, off since session 29. Set to "1" to
          # re-enable. Four consecutive runs injecting the corrected pattern
          # sets (08-05 → 08-12) drove decisive calls from a 7–17 historical
          # range down to 1–3, while the median ticker rose 5.69% over the same
          # fortnight: every prompt was carrying "BUY es sistemáticamente
          # fallido: 6% hit rate", mined entirely from the dead −4.80% May–June
          # window. The 08-14 run injected nothing (the excess gate failed
          # closed) and decisiveness recovered to 9 in one run — the control.
          # Weekly mining still runs and still persists; only the feedback into
          # the prompts is off. Written out explicitly rather than left unset so
          # the state is visible in the repo.
          PATTERN_INJECTION_ENABLED: "0"
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # Grades matured recommendations against realized prices. Independent of
      # today's run, so it executes even if the step above failed.
      - name: Evaluate recommendation outcomes
        if: ${{ !cancelled() }}
        run: python -m src.evaluate_outcomes
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      # Read-only diagnosis appended to the run's summary page (session 29), so
      # the decisiveness/mining/health picture is on the record for every run
      # instead of depending on someone running the script locally afterwards.
      # continue-on-error: a failed health check must never fail a green run.
      - name: Post-run health check
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/check_run.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
